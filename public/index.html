<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Next Transmissões</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #fff;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      flex-shrink: 0;
      background: linear-gradient(180deg, #111 0%, #0a0a0a 100%);
      border-bottom: 1px solid #1a1a1a;
    }
    body.live .topbar { padding: 4px 10px; border-bottom-color: #2a1010; }
    .logo {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      object-fit: contain;
    }
    body.live .logo { width: 22px; height: 22px; }
    .pill {
      background: #1a1a1a;
      border: 1px solid #2a1010;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.85rem;
      color: #b5bac1;
    }
    body.live .pill { font-size: 0.75rem; padding: 3px 10px; }
    .user-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      background: #1a1a1a;
      border: 1px solid #2a1010;
      border-radius: 999px;
      padding: 4px 12px 4px 4px;
      font-size: 0.85rem;
    }
    body.live .user-chip { display: none; }
    .user-chip img { width: 26px; height: 26px; border-radius: 50%; }

    main.grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 8px;
      padding: 0 10px 8px;
      overflow-y: auto;
      align-content: start;
      min-height: 0;
    }
    body.live main.grid {
      align-content: stretch;
      grid-auto-rows: 1fr;
      gap: 0;
      padding: 0;
    }
    .tile {
      position: relative;
      background: #111214;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      cursor: pointer;
      min-height: 0;
      border: 1px solid #1a1a1a;
    }
    body.live .tile {
      border-radius: 0;
      border: none;
      border-right: 1px solid #1a1010;
      border-bottom: 1px solid #1a1010;
    }
    body.live main.grid:has(.tile:nth-child(1):last-child) .tile {
      width: 100%;
      height: 100%;
    }
    .tile.full { grid-column: 1 / -1; aspect-ratio: auto; }
    .tile canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
    body.live .tile canvas { object-fit: contain; }
    .tile .label {
      position: absolute;
      left: 8px;
      bottom: 8px;
      background: rgba(10,10,10,.85);
      border: 1px solid #2a1010;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 0.78rem;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .tile .badge {
      background: #b71c1c;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 0.68rem;
      text-transform: uppercase;
      font-weight: 600;
    }
    .live-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #f44336; display: inline-block;
      animation: pulse 1.5s infinite;
      box-shadow: 0 0 6px #f44336;
    }
    @keyframes pulse { 50% { opacity: .4; box-shadow: 0 0 2px #f44336; } }

    .empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 8px;
      padding: 20px;
    }
    body.live .empty { display: none; }
    .empty .icon { font-size: 3rem; filter: grayscale(.5); }
    .empty h1 { font-size: 1.2rem; font-weight: 600; color: #e0e0e0; }
    .muted { color: #949ba4; font-size: 0.9rem; }
    .spinner {
      width: 22px; height: 22px;
      border: 3px solid #2a1010;
      border-top-color: #c62828;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .bottombar {
      flex-shrink: 0;
      padding: 10px 14px 14px;
      background: linear-gradient(0deg, #0d0d0d 0%, #0a0a0a 100%);
      border-top: 1px solid #1a1a1a;
    }
    body.live .bottombar { display: none; }
    .dock {
      display: flex;
      justify-content: center;
      gap: 12px;
    }
    .btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 12px 22px;
      background: #b71c1c;
      border: 1px solid #c62828;
      border-radius: 12px;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s;
    }
    .btn:hover { background: #c62828; border-color: #d32f2f; transform: scale(1.03); box-shadow: 0 0 20px rgba(198,40,40,.3); }
    .btn:disabled { background: #1a1a1a; border-color: #2a1010; color: #555; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 96px;
      transform: translateX(-50%);
      background: #1a1a1a;
      border: 1px solid #c62828;
      color: #dbdee1;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      z-index: 50;
      box-shadow: 0 0 12px rgba(198,40,40,.2);
    }
    .toast.err { border-color: #ff1744; color: #ff8a80; }

    /* --- Modal de qualidade --- */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(4px);
    }
    .modal-card {
      background: #111214;
      border: 1px solid #2a1010;
      border-radius: 14px;
      padding: 24px;
      width: 90%;
      max-width: 340px;
    }
    .modal-card h2 {
      font-size: 1rem;
      margin-bottom: 4px;
      color: #e0e0e0;
    }
    .modal-card .sub {
      font-size: 0.78rem;
      color: #949ba4;
      margin-bottom: 16px;
    }
    .quality-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .quality-opt {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #1a1a1a;
      border: 1px solid #2a1010;
      border-radius: 10px;
      color: #fff;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all .15s;
    }
    .quality-opt:hover { border-color: #c62828; background: #1e1210; }
    .quality-opt.active {
      border-color: #c62828;
      background: rgba(198,40,40,.15);
    }
    .quality-opt .qlabel { font-weight: 600; }
    .quality-opt .qinfo { font-size: 0.75rem; color: #949ba4; }
    .quality-opt .qcheck {
      width: 18px; height: 18px;
      border-radius: 50%;
      border: 2px solid #555;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .quality-opt.active .qcheck {
      border-color: #c62828;
      background: #c62828;
    }
    .quality-opt.active .qcheck::after {
      content: '✓';
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .modal-actions {
      margin-top: 14px;
      display: flex;
      justify-content: flex-end;
    }
    .modal-actions button {
      padding: 8px 20px;
      background: #c62828;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
    }
    .modal-actions button:hover { background: #d32f2f; }

    .settings-btn {
      background: none;
      border: 1px solid #2a1010;
      border-radius: 8px;
      padding: 6px;
      cursor: pointer;
      color: #b5bac1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s;
    }
    .settings-btn:hover { border-color: #c62828; color: #fff; }
    .settings-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>
  <div class="topbar">
    <img class="logo" src="/foto/1321a2929b5943c3cc2be6e3722c2552.png" alt="NEXT">
    <div id="people" class="pill">…</div>
    <button class="settings-btn" id="settingsBtn" title="Qualidade da transmissão" aria-label="Qualidade">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1z"/></svg>
    </button>
    <div id="userChip" class="user-chip" hidden>
      <img id="userAvatar" alt="">
      <span id="userName">…</span>
    </div>
  </div>

  <main id="grid" class="grid" hidden></main>

  <div id="empty" class="empty">
    <div class="icon">🖥️</div>
    <h1 id="emptyTitle">Conectando…</h1>
    <p id="emptyText" class="muted">Autenticando com o Discord</p>
    <div class="spinner"></div>
  </div>

  <div class="bottombar">
    <div class="dock">
      <button class="btn" id="btnTela" disabled>
        <svg viewBox="0 0 24 24"><path d="M3 5h18v11H3z"/><path d="M8 20h8"/></svg>
        Tela
      </button>
      <button class="btn" id="btnCamera" disabled>
        <svg viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
        Câmera
      </button>
    </div>
  </div>

  <div id="qualityModal" class="modal" hidden>
    <div class="modal-card">
      <h2>Qualidade da transmissão</h2>
      <p class="sub">Mais FPS = movimento mais fluido, mas exige mais upload.</p>
      <div class="quality-list" id="qualityList">
        <button class="quality-opt" data-q="1500000" data-fps="30">
          <span class="qlabel">Leve</span>
          <span class="qinfo">30 fps · 1,5 Mb/s</span>
          <span class="qcheck"></span>
        </button>
        <button class="quality-opt active" data-q="2500000" data-fps="30">
          <span class="qlabel">Equilibrado</span>
          <span class="qinfo">30 fps · 2,5 Mb/s</span>
          <span class="qcheck"></span>
        </button>
        <button class="quality-opt" data-q="5000000" data-fps="60">
          <span class="qlabel">Nítido</span>
          <span class="qinfo">60 fps · 5 Mb/s</span>
          <span class="qcheck"></span>
        </button>
        <button class="quality-opt" data-q="8000000" data-fps="120">
          <span class="qlabel">Máximo</span>
          <span class="qinfo">120 fps · 8 Mb/s</span>
          <span class="qcheck"></span>
        </button>
      </div>
      <div class="modal-actions">
        <button id="qualityClose">Concluir</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module">
    import { DiscordSDK } from 'https://esm.sh/@discord/embedded-app-sdk';

    const CLIENT_ID = '1540951591685853305';

    // Dentro do iframe do Discord a URL tem frame_id e todo tráfego passa
    // pelo proxy "/.proxy". Fora dele (teste direto no navegador), sem prefixo.
    const BASE = new URLSearchParams(location.search).has('frame_id') ? '/.proxy' : '';

    const $ = (id) => document.getElementById(id);

    let discordSdk = null;
    let session = null;   // resposta de /api/session
    let ws = null;
    let backoff = 1000;

    const players = new Map(); // slot -> StreamPlayer

    function toast(msg, err = false) {
      const el = $('toast');
      el.textContent = msg;
      el.className = 'toast' + (err ? ' err' : '');
      el.hidden = false;
      clearTimeout(toast._t);
      toast._t = setTimeout(() => (el.hidden = true), 4000);
    }

    async function api(pathName, body) {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 15000);
      try {
        const res = await fetch(BASE + pathName, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          signal: ctrl.signal,
        });
        const json = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(json.error || json.message || ('HTTP ' + res.status));
        return json;
      } finally {
        clearTimeout(t);
      }
    }

    // ---------------------------------------------------------- decodificação

    function b64ToU8(b64) {
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    // Pede keyframe ao transmissor via relay: usado quando o decoder é
    // recriado no meio do ar, para não esperar o ciclo periódico de 3s.
    function pedirKeyframe() {
      try {
        if (ws && ws.readyState === 1) {
          ws.send(JSON.stringify({ type: 'need-keyframe' }));
        }
      } catch {}
    }

    /**
     * Um stream da sala: recebe os pacotes binários do relay
     * ([slot][tipo][ts f64][clock f64][payload]) e desenha vídeo (canvas,
     * via VideoDecoder/WebCodecs) e som (AudioDecoder + WebAudio).
     */
    class StreamPlayer {
      constructor(info) {
        this.slot = info.slot;
        this.info = info;
        this.config = info.config || null;
        this.audioConfig = info.audioConfig || null;

        this.tile = document.createElement('div');
        this.tile.className = 'tile';
        this.tile.addEventListener('click', () => this.tile.classList.toggle('full'));
        this.canvas = document.createElement('canvas');
        this.ctx = this.canvas.getContext('2d', { alpha: false });
        this.label = document.createElement('div');
        this.label.className = 'label';
        this.label.innerHTML =
          '<span class="live-dot"></span><span></span><span class="badge"></span>';
        this.label.children[1].textContent = info.name || 'Transmissão';
        this.label.children[2].textContent = info.fonte === 'camera' ? 'cam' : 'tela';
        this.tile.append(this.canvas, this.label);

        this.decoder = null;
        this.waitingKey = true;
        this.pending = [];

        this.audioDecoder = null;
        this.audioCtx = null;
        this.nextAudioAt = 0;
      }

      setVideoConfig(config) {
        const mudou =
          !this.config ||
          this.config.width !== config.width ||
          this.config.height !== config.height ||
          this.config.codec !== config.codec;
        this.config = config;
        if (!mudou) {
          this.flushPending();
          return;
        }
        // O encoder reconfigurou (resolução nova): o decoder antigo não serve
        // mais — decodificar com o tamanho errado é o que corta a imagem.
        // Recria e pede keyframe para recomeçar do ponto certo.
        if (this.decoder) {
          try { this.decoder.close(); } catch {}
          this.decoder = null;
          this.waitingKey = true;
          this.pending.length = 0;
          pedirKeyframe();
        }
        this.ensureDecoder();
      }

      setAudioConfig(config) {
        this.audioConfig = config;
      }

      ensureDecoder() {
        if (this.decoder || !this.config || !window.VideoDecoder) return;
        const cfg = { ...this.config };
        if (cfg.description && typeof cfg.description === 'string') {
          cfg.description = b64ToU8(cfg.description);
        }
        cfg.optimizeForLatency = true;
        try {
          this.decoder = new VideoDecoder({
            output: (frame) => this.draw(frame),
            error: () => {
              // Caiu (ex.: perdeu referência): espera um novo keyframe.
              try { this.decoder.close(); } catch {}
              this.decoder = null;
              this.waitingKey = true;
            },
          });
          this.decoder.configure(cfg);
        } catch {
          this.decoder = null;
        }
      }

      flushPending() {
        this.ensureDecoder();
        const list = this.pending;
        this.pending = [];
        for (const chunk of list) this.feed(chunk);
      }

      pushBinary(buffer) {
        const dv = new DataView(buffer);
        const tipo = dv.getUint8(1);
        if (tipo === 3) return this.pushAudio(buffer);
        const ts = dv.getFloat64(2);
        const data = new Uint8Array(buffer, 18);
        const chunk = new EncodedVideoChunk({
          type: tipo === 1 ? 'key' : 'delta',
          timestamp: Number.isFinite(ts) ? ts : performance.now() * 1000,
          data,
        });
        if (!this.decoder && this.pending.length < 120) {
          this.pending.push(chunk);
          this.flushPending();
          return;
        }
        this.feed(chunk);
      }

      feed(chunk) {
        if (chunk.type === 'key') this.waitingKey = false;
        if (this.waitingKey) return; // sem ponto de partida, delta não serve
        if (!this.decoder || this.decoder.state !== 'configured') return;
        try {
          this.decoder.decode(chunk);
        } catch {}
      }

      draw(frame) {
        if (frame.displayWidth && (this.canvas.width !== frame.displayWidth || this.canvas.height !== frame.displayHeight)) {
          this.canvas.width = frame.displayWidth;
          this.canvas.height = frame.displayHeight;
        }
        try {
          this.ctx.drawImage(frame, 0, 0, this.canvas.width, this.canvas.height);
        } catch {}
        frame.close();
      }

      ensureAudio() {
        if (this.audioCtx || !window.AudioDecoder || !this.audioConfig) return null;
        try {
          this.audioCtx = new AudioContext({ sampleRate: this.audioConfig.sampleRate || 48000 });
          this.audioDecoder = new AudioDecoder({
            output: (ad) => this.play(ad),
            error: () => {},
          });
          this.audioDecoder.configure({
            codec: this.audioConfig.codec || 'opus',
            sampleRate: this.audioConfig.sampleRate || 48000,
            numberOfChannels: this.audioConfig.numberOfChannels || 2,
          });
        } catch {
          this.audioCtx = null;
          this.audioDecoder = null;
        }
        return this.audioCtx;
      }

      pushAudio(buffer) {
        if (!window.AudioDecoder) return;
        const ctx = this.ensureAudio();
        if (!ctx) return;
        if (ctx.state === 'suspended') ctx.resume().catch(() => {});

        const dv = new DataView(buffer);
        const ts = dv.getFloat64(2);
        const data = new Uint8Array(buffer, 18);
        if (!this.audioDecoder || this.audioDecoder.state !== 'configured') return;
        try {
          this.audioDecoder.decode(
            new EncodedAudioChunk({
              type: 'key',
              timestamp: Number.isFinite(ts) ? ts : performance.now() * 1000,
              data,
            }),
          );
        } catch {}
      }

      play(audioData) {
        const ctx = this.audioCtx;
        if (!ctx || ctx.state !== 'running') {
          audioData.close();
          return;
        }
        const frames = audioData.numberOfFrames;
        const channels = Math.min(2, audioData.numberOfChannels);
        const buf = ctx.createBuffer(channels, frames, audioData.sampleRate);
        for (let c = 0; c < channels; c++) {
          const plane = new Float32Array(frames);
          audioData.copyTo(plane, { planeIndex: c, format: 'f32-planar' });
          buf.copyToChannel(plane, c);
        }
        audioData.close();

        const src = ctx.createBufferSource();
        src.buffer = buf;
        src.connect(ctx.destination);
        const at = Math.max(ctx.currentTime + 0.05, this.nextAudioAt);
        src.start(at);
        this.nextAudioAt = at + buf.duration;
      }

      destroy() {
        try { this.decoder?.close(); } catch {}
        try { this.audioDecoder?.close(); } catch {}
        this.audioCtx?.close().catch?.(() => {});
        this.tile.remove();
      }
    }

    function addStream(info) {
      if (players.has(info.slot)) return players.get(info.slot);
      const p = new StreamPlayer(info);
      players.set(info.slot, p);
      $('grid').append(p.tile);
      $('empty').hidden = true;
      $('grid').hidden = false;
      return p;
    }

    function removeStream(slot) {
      const p = players.get(slot);
      if (!p) return;
      p.destroy();
      players.delete(slot);
      if (!players.size) {
        $('grid').hidden = true;
        showEmpty('Ninguém transmitindo', 'Use os botões abaixo para começar.');
      }
    }

    function reconcile(streams) {
      const alive = new Set(streams.map((s) => s.slot));
      for (const slot of [...players.keys()]) if (!alive.has(slot)) removeStream(slot);
      for (const s of streams) addStream(s);
      updatePeople();
    }

    function updatePeople() {
      const n = session ? participantsCount() : 0;
      const aoVivo = players.size > 0;
      document.body.classList.toggle('live', aoVivo);
      $('people').textContent = aoVivo
        ? `${players.size} transmitindo · ${n} na sala`
        : `${n} na sala`;
    }

    let participants = [];
    const participantsCount = () => participants.length;

    function showEmpty(title, text) {
      $('emptyTitle').textContent = title;
      $('emptyText').textContent = text;
      $('empty').hidden = false;
      $('empty').querySelector('.spinner')?.remove();
    }

    // ------------------------------------------------------------------ ws

    function connectViewer() {
      if (!session) return;
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}${BASE}/ws?t=${encodeURIComponent(session.viewerToken)}`);
      ws.binaryType = 'arraybuffer';

      let openedOnce = false;

      ws.addEventListener('open', () => {
        openedOnce = true;
        backoff = 1000;
        if (!players.size) showEmpty('Ninguém transmitindo', 'Use os botões abaixo para começar.');
        updatePeople();
      });

      ws.addEventListener('message', (e) => {
        if (typeof e.data !== 'string') {
          const slot = new DataView(e.data).getUint8(0);
          players.get(slot)?.pushBinary(e.data);
          return;
        }
        let msg;
        try { msg = JSON.parse(e.data); } catch { return; }

        switch (msg.type) {
          case 'state':
            participants = msg.participants ?? [];
            reconcile(msg.streams ?? []);
            break;
          case 'stream-start':
            addStream(msg);
            updatePeople();
            break;
          case 'stream-stop':
            removeStream(msg.slot);
            break;
          case 'config': {
            const p = players.get(msg.slot);
            if (p) p.setVideoConfig(msg.config);
            break;
          }
          case 'audio-config': {
            const p = players.get(msg.slot);
            if (p) p.setAudioConfig(msg.config);
            break;
          }
          case 'room-gone':
            toast('A sala foi fechada.', true);
            break;
          case 'error':
            toast(msg.message || 'Erro na sala.', true);
            break;
        }
      });

      ws.addEventListener('close', () => {
        for (const p of players.values()) p.destroy();
        players.clear();
        if (!session) return;
        if (!openedOnce) showEmpty('Falhou', 'Não foi possível conectar à sala.');
        else showEmpty('Reconectando…', 'A conexão com a sala caiu.');
        setTimeout(connectViewer, backoff);
        backoff = Math.min(backoff * 2, 15000);
      });

      ws.addEventListener('error', () => ws.close());
    }

    // ------------------------------------------------------------ arranque

    async function abrirShare(fonte) {
      if (!session) return;
      const url = new URL(session.shareUrl);
      const q = JSON.parse(localStorage.getItem('nextQuality') || '{"q":"2500000","fps":"30"}');
      url.searchParams.set('t', session.broadcasterToken);
      url.searchParams.set('q', q.q);
      url.searchParams.set('fps', q.fps);
      url.searchParams.set('fonte', fonte);

      if (discordSdk?.commands?.openExternalLink) {
        try {
          const r = await discordSdk.commands.openExternalLink({ url: url.toString() });
          if (r && r.opened === false) toast('Você recusou abrir o link.', true);
          return;
        } catch (err) {
          toast('Não foi possível abrir o link: ' + err.message, true);
          return;
        }
      }
      window.open(url.toString(), '_blank');
    }

    $('btnTela').addEventListener('click', () => abrirShare('tela'));
    $('btnCamera').addEventListener('click', () => abrirShare('camera'));

    // --- Qualidade ---
    const QUALITIES = [
      { q: '1500000', fps: '30', label: 'Leve', info: '30 fps · 1,5 Mb/s' },
      { q: '2500000', fps: '30', label: 'Equilibrado', info: '30 fps · 2,5 Mb/s' },
      { q: '5000000', fps: '60', label: 'Nítido', info: '60 fps · 5 Mb/s' },
      { q: '8000000', fps: '120', label: 'Máximo', info: '120 fps · 8 Mb/s' },
    ];
    let selectedQuality = JSON.parse(localStorage.getItem('nextQuality') || 'null') || QUALITIES[1];

    function highlightQuality() {
      document.querySelectorAll('.quality-opt').forEach((el) => {
        const match = el.dataset.q === selectedQuality.q && el.dataset.fps === selectedQuality.fps;
        el.classList.toggle('active', match);
      });
    }
    highlightQuality();

    document.querySelectorAll('.quality-opt').forEach((el) => {
      el.addEventListener('click', () => {
        selectedQuality = { q: el.dataset.q, fps: el.dataset.fps };
        localStorage.setItem('nextQuality', JSON.stringify(selectedQuality));
        highlightQuality();
      });
    });

    $('settingsBtn').addEventListener('click', () => {
      $('qualityModal').hidden = false;
    });
    $('qualityClose').addEventListener('click', () => {
      $('qualityModal').hidden = true;
      toast(`Qualidade: ${selectedQuality.label} (${selectedQuality.fps} fps)`);
    });
    $('qualityModal').addEventListener('click', (e) => {
      if (e.target === $('qualityModal')) $('qualityModal').hidden = true;
    });

    // Navegador só deixa o áudio tocar depois de um gesto: qualquer clique
    // na página retoma os contextos que nasceram suspensos.
    document.addEventListener('click', () => {
      for (const p of players.values()) p.audioCtx?.resume?.().catch?.(() => {});
    }, { capture: true });

    (async () => {
      try {
        discordSdk = new DiscordSDK(CLIENT_ID);
        await discordSdk.ready();

        const { code } = await discordSdk.commands.authorize({
          client_id: CLIENT_ID,
          response_type: 'code',
          state: '',
          prompt: 'none',
          scope: ['identify'],
        });

        const { access_token } = await api('/api/token', { code });
        const auth = await discordSdk.commands.authenticate({ access_token });

        session = await api('/api/session', {
          access_token,
          instance_id: discordSdk.instanceId,
          guild_id: discordSdk.guildId,
          channel_id: discordSdk.channelId,
        });

        const av = auth.user.avatar
          ? `https://cdn.discordapp.com/avatars/${auth.user.id}/${auth.user.avatar}.png`
          : `https://cdn.discordapp.com/embed/avatars/${(Number(auth.user.discriminator || 0) % 5)}.png`;
        $('userAvatar').src = av;
        $('userName').textContent = auth.user.global_name || auth.user.username;
        $('userChip').hidden = false;

        $('btnTela').disabled = false;
        $('btnCamera').disabled = false;

        showEmpty('Ninguém transmitindo', 'Use os botões abaixo para começar.');
        updatePeople();
        connectViewer();
      } catch (e) {
        console.error(e);
        showEmpty('Erro ao conectar', e.message || 'Recarregue a atividade.');
      }
    })();
  </script>
</body>
</html>
